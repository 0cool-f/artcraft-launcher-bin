# SPDX-License-Identifier: 0BSD
# Moves the package to upstream's latest stable release after building it. When the dependencies
# match upstream's Arch package it commits to main and publishes to the AUR itself, since pushes
# made with GITHUB_TOKEN start no other workflow; otherwise it opens a PR for review.
name: update

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pushed: ${{ steps.bump.outputs.pushed }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Find a newer upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/storytold/craft-launcher/releases/latest --jq .tag_name)
          latest=${tag#v}
          current=$(sed -n 's/^pkgver=//p' PKGBUILD)
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "artcraft-launcher $current is up to date"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "update/$latest" >/dev/null; then
            echo "PR branch update/$latest already exists"
            exit 0
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - name: Update PKGBUILD and push it, or open a PR when dependencies differ
        id: bump
        if: steps.latest.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          deps=$(ci/update.sh "$VERSION" "$notes")
          if [ "$deps" = match ]; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -a -m "Update to $VERSION" -m "$(cat "$notes")"
            git push origin HEAD:main
            { echo "pushed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "update/$VERSION"
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -am "Update to $VERSION"
          git push origin "update/$VERSION"
          gh pr create --base main --head "update/$VERSION" --title "Update to $VERSION" --body-file "$notes"

  publish:
    needs: bump
    if: needs.bump.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit
